[package]
name = "keyd-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
evdev = "0.13"
nix = { version = "0.27", features = ["fs", "ioctl", "poll", "signal", "term", "uio", "user", "inotify"] }
nom = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "1"
# uinput crate is also a good option, but evdev might cover it or we use nix/ioctl
# Let's add evdev-rs or similar if needed later, for now evdev is a good start.

